name: CI

# This workflow runs on pull requests and pushes to master
# It ensures code quality through type checking, linting, formatting, testing, and building
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    # A private database per job. Sharing one remote test database let two
    # pull requests' runs rebuild the schema under each other mid-test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backoffice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        run: cd ./backend && bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck:all

      - name: Lint
        run: bun run lint:ci

      - name: Format Check
        run: bun run check:ci

      - name: Run frontend tests
        run: bun run test

      - name: Run backend tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backoffice_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: cd ./backend && bun run test

      - name: Build
        run: bun --bun vite build

  # Runs alongside the test job, not after it: the two share nothing, and
  # waiting for one before starting the other doubled the time to a verdict.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A private database per job. Sharing one remote test database let two
    # pull requests' runs rebuild the schema under each other mid-test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: backoffice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install backend dependencies
        run: cd ./backend && bun install --frozen-lockfile

      # Keyed by the Playwright version, which is what decides the browser
      # build. Hashing package.json dropped the cache at every release, since
      # the release bumps the version in it.
      - name: Read the Playwright version
        id: playwright-version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # The backend test job no longer leaves a schema behind for this one.
      - name: Apply database migrations
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backoffice_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: cd ./backend && bunx drizzle-kit migrate

      - name: Run E2E tests
        env:
          CI: true
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/backoffice_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:5001/api
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: bunx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
