<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Dashboard</title>
    <meta
      name="description"
      content="Hotel management dashboard for front-office operations, reservations, and administrative functions."
    />
    <meta
      name="theme-color"
      content="#fcfcfc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0d0f10"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Theme before first paint: the app's CSS and ThemeProvider arrive with
         the JS bundle, so until then the page would be blank white, a flash
         on every load in the dark theme. Same storage key and rule as
         ThemeProvider; the colours are --background in each theme. -->
    <script>
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('tanstack.theme') || 'system';
        } catch (e) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      })();
    </script>
    <style>
      html {
        background: #fcfcfc;
        color-scheme: light;
      }
      html.dark {
        background: #0d0f10;
        color-scheme: dark;
      }
    </style>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hotel Dashboard" />
    <meta
      property="og:description"
      content="Hotel management dashboard for front-office operations, reservations, and administrative functions."
    />
    <meta property="og:site_name" content="Hotel Dashboard" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hotel Dashboard" />
    <meta
      name="twitter:description"
      content="Hotel management dashboard for front-office operations, reservations, and administrative functions."
    />

    <!-- Preload LCP image -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      href="/login-bg.avif"
      media="(min-width: 1024px)"
      fetchpriority="high"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
